name: Check catalog prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: { contents: write }
concurrency:
  group: catalog-price-check
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false || vars.ACTIONS_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "--only-binary=:all:" lxml==5.4.0
      - name: Collect Amazon.de catalog prices
        run: ./scripts/collect.ps1
        shell: pwsh
      - name: Publish progress and confirmed prices
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- rotation.json
          git add -- prices/
          git diff --cached --quiet && exit 0
          git -c user.name=GFY -c user.email='gfy-radar@users.noreply.github.com' commit -m "Record catalog progress and verified prices"
          gh auth setup-git
          git -c committer.name=GFY -c committer.email=gfy-radar@users.noreply.github.com pull --rebase origin main
          git push origin HEAD:main
