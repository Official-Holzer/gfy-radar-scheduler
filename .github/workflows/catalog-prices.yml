name: Check catalog prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: { contents: write }
concurrency:
  group: catalog-price-check
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false || vars.ACTIONS_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0
      - name: Collect Amazon.de catalog prices
        run: ./scripts/collect.ps1
        shell: pwsh
      - name: Publish confirmed prices
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- rotation.json
          git add -- prices/
          git diff --cached --quiet && exit 0
          git -c user.name=GFY -c user.email='gfy-radar@users.noreply.github.com' commit -m "Record catalog progress and verified prices"
          gh auth setup-git
          git -c committer.name=GFY -c committer.email=gfy-radar@users.noreply.github.com pull --rebase origin main
          git push origin HEAD:main
