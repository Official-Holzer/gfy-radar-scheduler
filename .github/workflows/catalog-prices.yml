name: Check catalog prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions: { contents: read }
concurrency:
  group: catalog-price-check
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false || vars.ACTIONS_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0
      - name: Collect Amazon.de catalog prices
        run: ./scripts/collect.ps1
        shell: pwsh
        env:
          GFY_ORIGIN: ${{ vars.GFY_ORIGIN }}
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
