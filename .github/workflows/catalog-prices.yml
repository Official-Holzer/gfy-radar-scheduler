name: Check catalog prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions: {}
concurrency:
  group: catalog-price-check
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false || vars.ACTIONS_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger hosted GFY checks and report verified observations
        shell: python
        run: |
          import json
          import re
          import time
          from urllib.request import urlopen

          site = 'https://gfy-radar.pages.dev'
          def read(path):
              with urlopen(site + path, timeout=20) as response:
                  return json.load(response)

          products = read('/catalog.json')
          verified = 0
          failures = 0
          for product in products:
              asin = product['id']
              if not re.fullmatch('[A-Z0-9]{10}', asin):
                  raise ValueError('Invalid catalog identifier')
              try:
                  data = read('/api/history/' + asin)
                  checked = data.get('lastAttempt') or 0
                  age = time.time() * 1000 - checked
                  observed = 0 <= age <= 3600000 and any(
                      p['source'] == 'amazon' and p['observed_at'] == checked
                      for p in data['observations'])
                  verified += int(observed)
                  print(asin, 'observed' if observed else 'price unavailable')
              except (OSError, ValueError, KeyError) as error:
                  failures += 1
                  print(asin, type(error).__name__)
          print(f'{verified} of {len(products)} products have a verified recent price.')
          if failures or not verified:
              raise SystemExit(1)
