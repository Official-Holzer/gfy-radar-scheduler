name: Read historical reference prices
on:
  workflow_dispatch:
    inputs:
      start:
        description: First catalog position (zero-based)
        required: true
        default: "0"
      count:
        description: Number of products (1–100)
        required: true
        default: "12"
permissions: { contents: read }
concurrency: reference-price-import
jobs:
  read:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=:all: lxml==5.4.0
      - name: Read dated prices
        env:
          START_INDEX: ${{ inputs.start }}
          PRODUCT_COUNT: ${{ inputs.count }}
        run: python scripts/read_reference_prices.py "$START_INDEX" "$PRODUCT_COUNT"
